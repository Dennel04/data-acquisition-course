; Stage A: bare-bones bring-up test. No kPa math, no timing loop -- just
; prove G5 reads something sane before building anything else on top.
; See ../README.md for what "reference" means here.
;
; M5Unified is pulled in only for a minimal on-screen "alive" status (not
; required by the assignment at this stage -- see part 2) so you can tell
; at a glance the board booted and is sampling, without opening the serial
; monitor. The graded comparison against the multimeter still happens via
; the Serial CSV, unchanged.

[env:atoms3r]
platform  = espressif32
board     = m5stack-atoms3   ; see ../README.md "Board id" note
framework = arduino

; AtomS3(R) has native USB-C acting as the Serial port (not a separate
; USB-UART chip) -- these two flags are required for Serial to work at all.
; Source: https://docs.m5stack.com/en/core/AtomS3 (build flags section).
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1

monitor_speed = 115200
upload_speed  = 460800

lib_deps =
    m5stack/M5Unified @ ^0.2.2   ; display only, same lib the full firmware uses

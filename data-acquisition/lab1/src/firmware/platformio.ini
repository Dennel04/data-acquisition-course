; Full reference build: kPa conversion, display, strict 10ms loop,
; JSON telemetry/command protocol (README part 4), button/letter stub.
;
; Board id note: PlatformIO's espressif32 platform (registry checked
; 2026-09) ships "m5stack-atoms3" but no dedicated "...atoms3r" board.
; Same MCU (ESP32-S3), same flash size and display (GC9107/ST7735,
; 128x128) as far as this build needs to know -- the AtomS3R-specific
; extras (PSRAM, BMI270/BMM150 IMU) aren't used by this lab, so the base
; config is enough. Verify on first flash: if M5Unified's display/button
; init fails, that's the first thing to check against the real board.
[env:atoms3r]
platform  = espressif32
board     = m5stack-atoms3
framework = arduino

; Native USB-C as Serial -- required, see stageA note / m5-docs AtomS3 page.
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1

monitor_speed = 115200
upload_speed  = 460800

lib_deps =
    m5stack/M5Unified @ ^0.2.2      ; display + button, same API across M5Stack boards
    bblanchon/ArduinoJson @ ^7.2.0  ; JSON in/out over UART

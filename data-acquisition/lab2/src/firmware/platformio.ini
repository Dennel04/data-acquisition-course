[platformio]
default_envs = atoms3r

[env:atoms3r]
platform = espressif32@6.13.0
board = m5stack-atoms3
framework = arduino
board_build.partitions = default_8MB.csv
monitor_speed = 115200
upload_speed = 460800
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DCORE_DEBUG_LEVEL=0
    -Wl,--wrap=nvs_flash_init
    -Wl,--wrap=nvs_flash_init_partition
    -Wl,--wrap=nvs_open
    -Wl,--wrap=nvs_open_from_partition
    -Wl,-u,__wrap_nvs_flash_init
    -Wl,-u,__wrap_nvs_flash_init_partition
    -Wl,-u,__wrap_nvs_open
    -Wl,-u,__wrap_nvs_open_from_partition
lib_deps =
    m5stack/M5Unified@0.2.25
    m5stack/M5GFX@0.2.32
    bblanchon/ArduinoJson@7.4.3
